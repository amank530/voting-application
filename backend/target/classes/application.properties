# =================================================================
# ECI ELECTION PORTAL - JAVA SPRING BOOT APPLICATION PROPERTIES
# Reading values directly from environment variables (.env file)
# =================================================================

# Server Port
server.port=${PORT:3000}

# MySQL Database Connection
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/eci_voting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:eci_admin}
spring.datasource.password=${DB_PASSWORD:eci_secure_password_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limit (for documents & photo uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# EC Admin Config
eci.admin.email=${EC_ADMIN_EMAIL:admin@eci.gov.in}
eci.admin.password=${EC_ADMIN_PASSWORD:ECI_Chief_Admin_2026!}
eci.admin.secret=${EC_ADMIN_SECRET_KEY:eci_master_admin_authorization_secret_2026}

# Security JWT
jwt.secret=${JWT_SECRET:eci_digital_voting_platform_super_secret_jwt_key_2026_xyz}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# eKYC API Key
ekyc.now.api.key=${EKYC_NOW_API_KEY:ekyc_live_key_eci_india_verification_2026}
